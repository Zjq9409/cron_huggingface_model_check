name: Daily LLM Hardware Advisor

on:
  push:
    branches: [main]
  schedule:
    # 01:00 UTC == 09:00 Asia/Shanghai. GitHub cron is always UTC.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-llm-hardware-advisor
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hardware Advisor Agent
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python agent.py

      - name: Add report to workflow summary
        run: cat daily_hardware_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit generated report and website
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add daily_hardware_report.md docs/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: update daily LLM hardware advisor report [skip ci]"
          git push
